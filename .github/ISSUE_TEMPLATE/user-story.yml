
name: "📖 User Story"
description: "Propose and evaluate a user story for NutriQuest AI."
title: "[US] "
labels:
  - user-story

body:
  - type: markdown
    attributes:
      value: |
        ## 🥗 NutriQuest AI
        Define a user need, the proposed solution, and its expected value.

  - type: dropdown
    id: role
    attributes:
      label: User Role
      description: "Who will benefit from this feature?"
      options:
        - Guest User
        - Registered User
        - Administrator
        - Other
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: User Story
      description: "Describe the feature from the user's perspective."
      placeholder: |
        As a [user],
        I want [goal],
        So that [benefit].
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: "List clear, specific, and testable conditions."
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "Select the MoSCoW priority."
      options:
        - Must Have
        - Should Have
        - Could Have
        - Won't Have
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## 📊 Story Evaluation
        Evaluate this story against the three project assessment criteria.

  - type: dropdown
    id: feasibility
    attributes:
      label: Feasibility
      description: "How technically achievable is this story?"
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: cost_effectiveness
    attributes:
      label: Cost-effectiveness
      description: "Does the expected value justify the required resources?"
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: problem_solving
    attributes:
      label: Problem-solving Effectiveness
      description: "How effectively does it address the user's problem?"
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Evaluation Justification
      description: "Briefly justify your ratings with clear reasoning."
      placeholder: |
        - Feasibility:
        - Cost-effectiveness:
        - Problem-solving Effectiveness:
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: "Dependencies, assumptions, or constraints (optional)."
      placeholder: "Add any relevant details..."
    validations:
      required: false
