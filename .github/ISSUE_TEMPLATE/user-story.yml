name: "📖 User Story"
description: "Propose and evaluate a user story for NutriQuest AI."
title: "[US] "
labels:
  - user-story
  - needs-triage

body:
  - type: markdown
    attributes:
      value: |
        ## 🥗 NutriQuest AI: User Story
        Describe a user need, the proposed solution, and its expected value.
        Keep it small, specific, and testable. One story per issue.

  - type: input
    id: summary
    attributes:
      label: Short Summary
      description: "A one-line headline (also helps you complete the issue title above)."
      placeholder: "e.g., Scan a barcode to log a packaged food"
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: User Role
      description: "Who will benefit from this feature?"
      options:
        - Guest User
        - Registered User
        - Administrator
        - Other (specify in the story)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: "Which part of the product does this touch?"
      multiple: true
      options:
        - Onboarding & Accounts
        - Meal Logging
        - Nutrition Analysis / AI
        - Meal Planning & Recommendations
        - Goals & Progress Tracking
        - Gamification / Quests
        - Notifications
        - Admin & Content Management
        - Accessibility & Localization
        - Other
    validations:
      required: false

  - type: textarea
    id: story
    attributes:
      label: User Story
      description: "Describe the feature from the user's perspective."
      value: |
        As a [type of user],
        I want [a goal or action],
        So that [the benefit or value I get].
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Context
      description: "What pain point or opportunity motivates this story? Include evidence if available (feedback, metrics, research)."
      placeholder: "Currently, users must... which leads to..."
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: "Clear, specific, and testable conditions. Tip: use Given / When / Then for behavior."
      value: |
        - [ ] Given [context], when [action], then [expected result]
        - [ ] Given [context], when [action], then [expected result]
        - [ ] Edge case / error state: [describe]
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: "What this story deliberately does NOT cover."
      placeholder: "- Not included: ..."
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      description: "How essential is this story?"
      options:
        - Must Have
        - Should Have
        - Could Have
        - Won't Have (this time)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## 📊 Story Evaluation
        Rate the story against the three project assessment criteria, then justify each rating.

  - type: dropdown
    id: feasibility
    attributes:
      label: Feasibility
      description: "How technically achievable is this story with our current stack, team, and timeline?"
      options:
        - High (straightforward, well understood)
        - Medium (some complexity or unknowns)
        - Low (major technical risk or dependency)
    validations:
      required: true

  - type: dropdown
    id: cost_effectiveness
    attributes:
      label: Cost-effectiveness
      description: "Does the expected value justify the required resources (time, money, effort)?"
      options:
        - High (big value for modest effort)
        - Medium (value roughly matches effort)
        - Low (effort outweighs value)
    validations:
      required: true

  - type: dropdown
    id: problem_solving
    attributes:
      label: Problem-solving Effectiveness
      description: "How well does it solve the user's problem?"
      options:
        - High (fully resolves the problem)
        - Medium (partially resolves it)
        - Low (marginal impact)
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Evaluation Justification
      description: "Briefly justify each rating with clear reasoning."
      value: |
        - **Feasibility:** 
        - **Cost-effectiveness:** 
        - **Problem-solving Effectiveness:** 
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: "Dependencies, assumptions, risks, constraints, mockups, or links (optional)."
      placeholder: "Add any relevant details, screenshots, or related issues (#123)..."
    validations:
      required: false

  - type: checkboxes
    id: ready
    attributes:
      label: Definition of Ready
      description: "Quick self-check before submitting (INVEST)."
      options:
        - label: Independent, can be delivered without waiting on other stories (or dependencies are noted)
        - label: Small enough to complete in a single sprint
        - label: Acceptance criteria are testable
        - label: I searched existing issues and this is not a duplicate
