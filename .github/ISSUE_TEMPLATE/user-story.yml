name: "📖 User Story"
description: "Propose a user story for NutriQuest AI."
title: "[US] "
labels: ["user-story"]

body:
  - type: markdown
    attributes:
      value: |
        ## 🥗 NutriQuest AI
        Describe a user need and the value it brings to the project.

  - type: input
    id: story_id
    attributes:
      label: Story ID
      placeholder: "US-01"
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: User Role
      options:
        - Guest User
        - Registered User
        - Administrator
        - Other
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: User Story
      description: "Use the format below."
      placeholder: |
        As a [user],
        I want [goal],
        So that [benefit].
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: "How will we know this story is complete?"
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "MoSCoW prioritization."
      options:
        - Must Have
        - Should Have
        - Could Have
        - Won't Have
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## 📊 Evaluation
        Rate the story and briefly justify your decision.

  - type: dropdown
    id: feasibility
    attributes:
      label: Feasibility
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: cost_effectiveness
    attributes:
      label: Cost-effectiveness
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: problem_solving
    attributes:
      label: Problem-solving Effectiveness
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Evaluation Justification
      description: "Briefly explain your ratings."
      placeholder: "Why is this story feasible, cost-effective, and useful?"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: "Dependencies, assumptions, or constraints (optional)."
    validations:
      required: false
