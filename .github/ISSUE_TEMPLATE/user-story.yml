
name: "📖 User Story"
description: "Create and evaluate a user story for NutriQuest AI."
title: "[US] "
labels:
  - user-story

body:
  - type: markdown
    attributes:
      value: |
        ## 🥗 NutriQuest AI
        Define a user need, the proposed solution, and its expected value.
        Keep each story small, specific, and testable.

  - type: input
    id: summary
    attributes:
      label: Short Summary
      description: "A concise title describing the user story."
      placeholder: "e.g., Track daily water intake"
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: User Role
      description: "Who will benefit from this feature?"
      options:
        - Guest User
        - Registered User
        - Administrator
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: "Select the primary area of the product."
      options:
        - Onboarding & Accounts
        - Meal Logging
        - Nutrition Analysis / AI
        - Meal Planning & Recommendations
        - Goals & Progress Tracking
        - Gamification / Quests
        - Notifications
        - Admin & Content Management
        - Accessibility & Localization
        - Other
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: User Story
      description: "Describe the feature from the user's perspective."
      value: |
        As a [type of user],
        I want [a goal or action],
        So that [the benefit or value I get].
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Context
      description: "What user problem or need motivates this story?"
      placeholder: "Describe the current problem or opportunity..."
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: "List clear, specific, and testable conditions."
      value: |
        - [ ] Given [context], when [action], then [expected result]
        - [ ] Given [context], when [action], then [expected result]
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: "What is deliberately excluded from this story? (Optional)"
      placeholder: "List features or behaviors not covered..."
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      description: "How important is this story to the project?"
      options:
        - Must Have
        - Should Have
        - Could Have
        - Won't Have (this time)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## 📊 Story Evaluation
        Evaluate the proposed story against the three project assessment criteria.
        Select a rating and justify your decision.

  - type: dropdown
    id: feasibility
    attributes:
      label: Feasibility
      description: "How technically achievable is this story with our team, tools, and timeline?"
      options:
        - High - Straightforward to implement
        - Medium - Some complexity or challenges
        - Low - Major technical risks or dependencies
    validations:
      required: true

  - type: dropdown
    id: cost_effectiveness
    attributes:
      label: Cost-effectiveness
      description: "Does the expected value justify the required time, effort, and resources?"
      options:
        - High - High value for relatively low effort
        - Medium - Value is reasonable compared to effort
        - Low - Required effort outweighs expected value
    validations:
      required: true

  - type: dropdown
    id: problem_solving
    attributes:
      label: Problem-solving Effectiveness
      description: "How effectively does this story address the user's problem?"
      options:
        - High - Directly addresses the problem
        - Medium - Partially addresses the problem
        - Low - Limited impact on the problem
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Evaluation Justification
      description: "Explain the reasoning behind each rating."
      value: |
        - **Feasibility:**
        - **Cost-effectiveness:**
        - **Problem-solving Effectiveness:**
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: "Dependencies, assumptions, risks, or related issues (Optional)."
      placeholder: "Add any relevant details or references..."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## ✅ Definition of Ready
        Before submitting, review the following quality checklist.

  - type: checkboxes
    id: ready
    attributes:
      label: Story Quality Checklist
      options:
        - label: The story is clear and focused on one user need.
        - label: Acceptance criteria are specific and testable.
        - label: Dependencies and assumptions are identified, if any.
        - label: I checked for duplicate issues.
    validations:
      required: false
