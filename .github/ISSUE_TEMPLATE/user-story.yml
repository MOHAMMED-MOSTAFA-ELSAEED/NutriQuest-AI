name: "📖 User Story"
description: "Create a user story for NutriQuest AI."
title: "[US] "
labels: ["user-story"]

body:
  - type: markdown
    attributes:
      value: |
        ### 🥗 NutriQuest AI
        Define a user need, its expected value, and how it can be delivered.

  - type: input
    id: story_id
    attributes:
      label: Story ID
      placeholder: "US-01"
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: User Role
      options:
        - Guest User
        - Registered User
        - Administrator
        - Other
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: User Story
      description: "As a [user], I want [goal], so that [benefit]."
      placeholder: "As a user, I want ... so that ..."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: "List clear, testable conditions."
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options:
        - Must Have
        - Should Have
        - Could Have
        - Won't Have
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### 📊 Story Evaluation
        Explain the reasoning behind each rating.

  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation & Justification
      description: "Address all three assessment criteria."
      value: |
        **1. Feasibility:** High / Medium / Low
        - Technical requirements and implementation challenges:

        **2. Cost-effectiveness:** High / Medium / Low
        - Required resources, development effort, and expected value:

        **3. Problem-solving Effectiveness:** High / Medium / Low
        - User problem, proposed solution, and expected impact:
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies & Notes
      description: "Mention related features, assumptions, or constraints (if any)."
    validations:
      required: false

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort (Story Points)
      options:
        - "1 - Very Small"
        - "2 - Small"
        - "3 - Medium"
        - "5 - Large"
        - "8 - Very Large"
    validations:
      required: true
